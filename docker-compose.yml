# Local PostgreSQL for Procurement Radar (see docs/decisions.md D-05).
# No cloud account, no managed database, no quota. One container, one disk.
#
# Configuration comes from the .env file next to this compose file.
# Copy .env.example to .env first — POSTGRES_PASSWORD has no default on purpose.

services:
  postgres:
    image: postgres:16
    container_name: procurement-radar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-procurement_radar}
      POSTGRES_USER: ${POSTGRES_USER:-procurement_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
      # Turkish source text is stored verbatim; the cluster must be UTF-8.
      POSTGRES_INITDB_ARGS: --encoding=UTF8
      # Keep the cluster in a subdirectory of the mount so the bind-mount root
      # stays free of files the container did not create.
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    # D-08: every timestamp is stored and served in UTC. Conversion from
    # Europe/Istanbul happens in Parse(), never in the database.
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      # Bound to loopback by default. The worker runs on the same machine;
      # set POSTGRES_BIND_ADDRESS=0.0.0.0 only if you deliberately want the
      # database reachable from the local network.
      #
      # 60432 on the host and not 5432, and that is D-23 rather than taste. The
      # dynamic port range on the deployment machine is 1024-60000, so Hyper-V
      # can and did reserve 5432 on a boot - the container ran, reported healthy,
      # and nothing on the host could reach it. Above 60000 is outside the
      # allocatable pool. Inside the container it is still 5432.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-60432}:5432"
    volumes:
      # D-05: local volume under ./data, which is gitignored.
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-procurement_radar}" -d "${POSTGRES_DB:-procurement_radar}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
